<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#C62B23" id="theme-color" />
    <title>자전거 날씨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Gothic+A1:wght@500;700;800&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app" class="app" data-theme="day" data-state="unknown">
      <!-- 상단 바람 밴드 -->
      <header class="band">
        <div class="band__main">
          <div class="band__dial" aria-hidden="true">
            <svg viewBox="0 0 100 100" class="dial">
              <circle cx="50" cy="50" r="46" class="dial__ring" />
              <!-- 0° 상태에서 위쪽을 가리킨다. arrowDeg가 여기서부터 회전한다. -->
              <g class="dial__arrow" id="arrow">
                <line x1="50" y1="30" x2="50" y2="74" />
                <path d="M50 14 L33 44 L50 35 L67 44 Z" />
              </g>
              <circle cx="50" cy="50" r="8" class="dial__dot" />
            </svg>
          </div>

          <div class="band__text">
            <p class="band__label" id="label">정지</p>
            <p class="band__speed">
              <span id="speed">–</span><span class="unit">m/s</span>
            </p>
          </div>

          <div class="band__abs">
            <p class="band__bearing" id="bearing">–</p>
            <p class="band__caption">절대 풍향</p>
          </div>
        </div>

        <!-- 보조 정보 띠 -->
        <div class="strip">
          <div class="strip__weather">
            <span class="strip__icon" id="sky-icon" aria-hidden="true"></span>
            <span id="temp">–°</span>
            <span class="strip__sep" id="sky-sep">·</span>
            <span id="sky-text">–</span>
            <span class="strip__dim" id="feels-wrap">체감 <span id="feels">–°</span></span>
          </div>
          <div class="strip__nav">
            <span id="kmh">– km/h</span>
            <span class="strip__sep">·</span>
            <span>750 m</span>
          </div>
        </div>

        <div class="stale" id="stale" hidden></div>
      </header>

      <!-- 하단 지도 -->
      <section class="map" id="map">
        <div class="map__fallback" id="map-fallback">
          <svg viewBox="0 0 200 300" class="map__sketch" aria-hidden="true">
            <path d="M-10 300 Q 60 240 92 172 T 140 40" class="sketch__river" />
            <line x1="0" y1="150" x2="200" y2="196" class="sketch__road" />
            <line x1="30" y1="300" x2="128" y2="30" class="sketch__road thin" />
          </svg>
          <p class="map__note" id="map-note">지도 타일 없음 · 목 데이터 모드</p>
        </div>

        <!-- 절대 풍향 화살표 오버레이 -->
        <svg class="map__wind" id="map-wind" aria-hidden="true"></svg>

        <!-- 라이더 마커 (아래 1/3) -->
        <div class="rider" aria-hidden="true">
          <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="15" class="rider__ring" />
            <path d="M20 8 L27 30 L20 25.5 L13 30 Z" class="rider__tip" />
          </svg>
        </div>
      </section>

      <!-- 예외 상태 오버레이 -->
      <div class="overlay" id="overlay" hidden>
        <div class="overlay__box">
          <div class="overlay__icon" id="overlay-icon"></div>
          <h1 class="overlay__title" id="overlay-title"></h1>
          <p class="overlay__body" id="overlay-body"></p>
          <button class="overlay__cta" id="overlay-cta" hidden></button>
        </div>
      </div>
    </main>

    <!-- 개발용 상태 전환 패널 (프로덕션 빌드에서는 제거) -->
    <div class="devbar" id="devbar" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
